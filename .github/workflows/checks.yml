name: Course checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Bounded HTTP-origin restore diagnostic
        run: node node_modules/@playwright/test/cli.js test --grep 'genuine backup' --repeat-each=20
        env:
          COURSE_URL: http://127.0.0.1:8765/START-HERE.html
      - run: npm run test:browser
      - run: npm run test:package
      - run: npm run package
